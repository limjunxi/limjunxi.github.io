
<div id="music"></div>

<button id="musicButton" onclick="toggleMusic()" aria-label="Mute music">
    🔊
</button>

<style>
#music {
    position: fixed;
    width: 1px;
    height: 1px;
    left: -10px;
    top: -10px;
    overflow: hidden;
}

#musicButton {
    position: fixed;
    bottom: 25px;
    left: 25px;
    width: 56px;
    height: 56px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: white;
    font-size: 22px;
    cursor: pointer;
    z-index: 9999;
    transition: background 0.2s ease, transform 0.2s ease;
}

#musicButton:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.05);
}
</style>

<script>
let player;
let isMuted = false;

function onYouTubeIframeAPIReady() {
    player = new YT.Player("music", {
        height: "1",
        width: "1",
        videoId: "o4qjk8_5gmU",

        playerVars: {
            autoplay: 1,
            controls: 0,
            loop: 1,
            playlist: "o4qjk8_5gmU",
            playsinline: 1
        },

        events: {
            onReady: function(event) {
                event.target.unMute();
                event.target.setVolume(100);
                event.target.playVideo();
            }
        }
    });
}

function toggleMusic() {
    if (!player) return;

    if (isMuted === false) {
        player.mute();
        isMuted = true;

        document.getElementById("musicButton").textContent = "🔇";
        document.getElementById("musicButton").setAttribute("aria-label", "Unmute music");
    } else {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
        isMuted = false;

        document.getElementById("musicButton").textContent = "🔊";
        document.getElementById("musicButton").setAttribute("aria-label", "Mute music");
    }
}

const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
</script>
