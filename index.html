<script>
const MUSIC_YOUTUBE_URL = "https://www.youtube.com/watch?v=YOUR_VIDEO_ID";

function youtubeId(link) {
    try {
        const url = new URL(link);

        const id = url.hostname === "youtu.be"
            ? url.pathname.slice(1)
            : url.searchParams.get("v");

        return /^[A-Za-z0-9_-]{11}$/.test(id || "") ? id : "";
    } catch {
        return "";
    }
}

const musicId = youtubeId(o4qjk8_5gmU);
const music = document.getElementById("music");
const muteButton = document.getElementById("mute");
const soundIcon = document.getElementById("soundIcon");

let muted = true;

if (musicId) {
    music.src =
        "https://www.youtube-nocookie.com/embed/" +
        musicId +
        "?autoplay=1&mute=1&loop=1&playlist=" +
        musicId +
        "&controls=0&enablejsapi=1";
}

muteButton.addEventListener("click", () => {
    if (!musicId) return;

    music.contentWindow.postMessage(
        JSON.stringify({
            event: "command",
            func: muted ? "unMute" : "mute",
            args: []
        }),
        "https://www.youtube-nocookie.com"
    );

    muted = !muted;

    soundIcon.src = muted
        ? "https://img.icons8.com/ios-glyphs/60/ffffff/no-audio--v1.png"
        : "https://img.icons8.com/ios-glyphs/60/ffffff/high-volume--v1.png";

    muteButton.title = muted ? "Unmute" : "Mute";
    muteButton.setAttribute("aria-label", muteButton.title);
});
</script>
