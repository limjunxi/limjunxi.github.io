<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="A portfolio of selected projects, skills, and open-source work.">
  <title>Your Name — Developer Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #11182a;
      --panel-hover: #151e33;
      --text: #eef2ff;
      --muted: #9ba8c4;
      --line: rgba(161, 178, 216, .15);
      --accent: #8bffb0;
      --accent-2: #91a7ff;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .wrap { width: min(1080px, calc(100% - 48px)); margin-inline: auto; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 16, 32, .82);
      backdrop-filter: blur(16px);
    }
    .nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .brand { font: 700 15px var(--mono); letter-spacing: -.04em; }
    .brand span { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 28px; color: var(--muted); font-size: 13px; }
    .nav-links a:hover { color: var(--text); }
    .nav-links .nav-cta { color: var(--accent); border: 1px solid rgba(139,255,176,.35); padding: 8px 12px; border-radius: 8px; }
    .hero { min-height: 620px; display: grid; align-items: center; padding-block: 100px 112px; position: relative; }
    .hero::before {
      content: ""; position: absolute; z-index: -1; width: 500px; height: 500px;
      right: -80px; top: 32px; border-radius: 50%;
      background: radial-gradient(circle, rgba(96, 116, 255, .19), transparent 68%);
      filter: blur(14px); pointer-events: none;
    }
    .eyebrow { color: var(--accent); font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 780px; margin: 20px 0; font-size: clamp(48px, 8vw, 88px); line-height: .99; letter-spacing: -.075em; }
    h1 .dim { color: #8793af; }
    .hero-copy { max-width: 560px; color: var(--muted); font-size: 17px; }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 32px; }
    .button { display: inline-flex; align-items: center; gap: 9px; padding: 12px 16px; border-radius: 9px; font-size: 13px; font-weight: 650; transition: transform .18s, background .18s; }
    .button:hover { transform: translateY(-2px); }
    .button-primary { background: var(--accent); color: #07120c; }
    .button-secondary { border: 1px solid var(--line); color: var(--text); background: rgba(255,255,255,.02); }
    .button svg, .link-arrow svg { width: 15px; height: 15px; }
    .status { margin-top: 54px; display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px rgba(139,255,176,.7); }
    section { padding-block: 84px; border-top: 1px solid var(--line); }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 30px; }
    .section-kicker { color: var(--accent); font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    h2 { margin: 8px 0 0; font-size: clamp(30px, 4vw, 42px); line-height: 1.1; letter-spacing: -.055em; }
    .section-note { max-width: 380px; color: var(--muted); font-size: 13px; }
    .project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .project {
      min-height: 270px; padding: 24px; border: 1px solid var(--line); border-radius: 14px;
      background: linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
      display: flex; flex-direction: column; transition: transform .2s, border-color .2s, background .2s;
    }
    .project:hover { transform: translateY(-4px); border-color: rgba(139,255,176,.35); background: var(--panel-hover); }
    .project-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
    .project-icon { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 11px; background: rgba(139,255,176,.09); color: var(--accent); font: 15px var(--mono); }
    .project-links { display: flex; gap: 12px; }
    .project-links a { color: var(--muted); display: inline-flex; }
    .project-links a:hover { color: var(--accent); }
    .project-links svg { width: 17px; height: 17px; }
    .project h3 { margin: 23px 0 8px; font-size: 19px; letter-spacing: -.03em; }
    .project p { margin: 0; color: var(--muted); font-size: 13px; max-width: 470px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 25px; }
    .tag { color: #b9c4df; background: rgba(145,167,255,.09); border: 1px solid rgba(145,167,255,.12); border-radius: 99px; padding: 5px 9px; font: 10px var(--mono); }
    .about-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: start; }
    .about-copy { color: var(--muted); font-size: 14px; }
    .about-copy p { margin: 0 0 16px; }
    .skill-panel { padding: 23px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .skill-panel h3 { margin: 0 0 17px; font: 12px var(--mono); color: var(--accent); }
    .skill-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-list span { padding: 7px 10px; border-radius: 7px; background: rgba(255,255,255,.045); color: #c7d0e4; font-size: 11px; }
    .contact-card { padding: clamp(26px, 6vw, 56px); border: 1px solid var(--line); border-radius: 18px; background: radial-gradient(ellipse at 90% 0%, rgba(139,255,176,.1), transparent 45%), var(--panel); }
